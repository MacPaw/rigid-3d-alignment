[project]
name = "asset-vla"
version = "0.1.0"
description = "Rigid 3D Object Alignment: Optimization vs. Feed-Forward Prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "einops>=0.8.0",
    "etils[epath]>=1.9.0",
    "flax==0.10.2",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "numpy>=1.22.4,<2.0.0",
    "numpydantic>=1.6.6",
    "openpi-client",
    "pandas>=2.0.0",
    "pillow>=11.0.0",
    "safetensors>=0.4.5",
    "scipy>=1.14.0",
    "torch==2.7.1",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb>=0.19.1",
    "beartype==0.19.0",
    "transformers==4.57.6",
    "torchvision",
    "datasets==4.0.0",
    "trimesh",
    "huggingface-hub>=0.32.3",
]


[project.urls]
Repository = "https://github.com/MacPaw/rigid-3d-alignment"

[dependency-groups]
dev = [
    "ruff>=0.8.6",
    "matplotlib>=3.10.0",
]


[tool.uv]
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74"]

[tool.uv.sources]
openpi-client = { git = "https://github.com/Physical-Intelligence/openpi", subdirectory = "packages/openpi-client" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",   # Conflicts with array typing.
    "T201",   # We use print statements.
    "PD008",  # Lots of false positives.
    "ISC001", # Disabling to support ruff format.
    "LOG015", # Use logger.info.
]
unfixable = [
    "B905", # Fix defaults to strict=False, which is not what we want.
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true